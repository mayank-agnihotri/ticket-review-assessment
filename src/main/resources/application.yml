spring:
  application:
    name: ticket-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketmgmt}
    username: ${SPRING_DATASOURCE_USERNAME:ticket}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      type: ${SPRING_AI_VECTORSTORE_TYPE:pgvector}
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${APP_RAG_EMBEDDING_DIMENSIONS:768}
        initialize-schema: true
        table-name: ticket_vector_store

app:
  tickets:
    list-max: ${APP_TICKETS_LIST_MAX:500}
  rag:
    top-k: ${APP_RAG_TOP_K:5}
    similarity-threshold: ${APP_RAG_SIMILARITY_THRESHOLD:0.65}
    max-chunk-chars: ${APP_RAG_MAX_CHUNK_CHARS:1500}
    embedding-dimensions: ${APP_RAG_EMBEDDING_DIMENSIONS:768}
    vector-store:
      type: ${APP_RAG_VECTOR_STORE_TYPE:pgvector}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}
